<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><rect width="100%" height="100%" fill="white"/><text x="42" y="64.9" font-family="DejaVu Serif, Georgia, serif" font-size="35" font-weight="400" fill="#4d3533">Gold layer / star schema</text><text x="44" y="105.86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#585254">Two dimensions connect to sales through customer_key and product_key.</text><rect x="405" y="150" width="390" height="350" rx="14" fill="white" stroke="#73a89a" stroke-width="2"/><text x="429" y="182.16" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#73a89a">FACT VIEW</text><text x="429" y="222.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#4d3533">gold.fact_sales</text><line x1="427" y1="241" x2="773" y2="241" stroke="#eae9ea" stroke-width="2"/><text x="429" y="275.98" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#585254">order_number</text><text x="429" y="314.98" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4d3533">customer_key  [join]</text><text x="429" y="353.98" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4d3533">product_key  [join]</text><text x="429" y="392.98" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#585254">order_date / shipping_date / due_date</text><text x="429" y="431.98" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#585254">sales_amount / quantity / price</text><line x1="235" y1="543" x2="235" y2="525" stroke="#73a89a" stroke-width="3"/><line x1="235" y1="525" x2="505" y2="525" stroke="#73a89a" stroke-width="3"/><line x1="505" y1="525" x2="505" y2="500" stroke="#73a89a" stroke-width="3"/><line x1="965" y1="543" x2="965" y2="525" stroke="#73a89a" stroke-width="3"/><line x1="965" y1="525" x2="695" y2="525" stroke="#73a89a" stroke-width="3"/><line x1="695" y1="525" x2="695" y2="500" stroke="#73a89a" stroke-width="3"/><text x="65" y="524.1" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#73a89a">customer_key</text><text x="1007" y="524.1" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#73a89a">product_key</text><rect x="42" y="550" width="520" height="340" rx="14" fill="white" stroke="#eae9ea" stroke-width="2"/><rect x="638" y="550" width="520" height="340" rx="14" fill="white" stroke="#eae9ea" stroke-width="2"/><text x="64" y="581.16" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#73a89a">CUSTOMER DIMENSION</text><text x="64" y="620.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#4d3533">gold.dim_customers</text><text x="660" y="581.16" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#73a89a">PRODUCT DIMENSION</text><text x="660" y="620.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#4d3533">gold.dim_products</text><text x="64" y="665.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">customer_key / customer_id</text><text x="64" y="701.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">customer_number</text><text x="64" y="737.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">first_name / last_name</text><text x="64" y="773.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">country / marital_status / gender</text><text x="64" y="809.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">birthdate / create_date</text><text x="660" y="665.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">product_key / product_id / product_number</text><text x="660" y="701.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">product_name / category_id</text><text x="660" y="737.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">category / subcategory / maintenance</text><text x="660" y="773.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">cost / product_line / start_date</text><text x="660" y="850.04" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#73a89a">Current products only: prd_end_dt IS NULL</text><line x1="42" y1="922" x2="1158" y2="922" stroke="#eae9ea" stroke-width="2"/><text x="44" y="958.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">All three objects are SQL views. Lines show logical joins, not enforced foreign keys.</text></svg>
