<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><rect width="100%" height="100%" fill="white"/><text x="42" y="64.9" font-family="DejaVu Serif" font-size="35" font-weight="400" fill="#4d3533">SQL Server data warehouse</text><text x="44" y="106.8" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#585254">CRM + ERP source data, organized through three layers</text><rect x="42" y="145" width="1116" height="110" rx="14" fill="#f6f2ef" stroke="#eae9ea" stroke-width="2"/><text x="64" y="177.1" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#585254">SOURCE SYSTEMS</text><text x="64" y="215.68" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#4d3533">CRM</text><text x="144" y="215.86" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#4d3533">Customers / Products / Sales</text><text x="646" y="215.68" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#4d3533">ERP</text><text x="722" y="214.92" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#4d3533">Customers / Locations / Categories</text><rect x="42" y="310" width="344" height="284" rx="14" fill="white" stroke="#73a89a" stroke-width="2"/><text x="64" y="345.04" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#73a89a">01</text><text x="64" y="390.26" font-family="DejaVu Serif" font-size="29" font-weight="400" fill="#4d3533">Bronze</text><text x="64" y="427.86" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#4d3533">Raw ingestion</text><text x="64" y="467.92" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#585254">Six source tables</text><text x="64" y="498.92" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#585254">TRUNCATE + BULK INSERT</text><text x="64" y="529.92" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#585254">Timing + error messages</text><text x="64" y="574.1" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#73a89a">Load procedure included</text><rect x="428" y="310" width="344" height="284" rx="14" fill="white" stroke="#eae9ea" stroke-width="2"/><text x="450" y="345.04" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#73a89a">02</text><text x="450" y="390.26" font-family="DejaVu Serif" font-size="29" font-weight="400" fill="#4d3533">Silver</text><text x="450" y="427.86" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#4d3533">Clean + standardize</text><text x="450" y="467.92" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#585254">CRM + ERP integration</text><text x="450" y="498.92" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#585254">Prepared source relations</text><text x="450" y="529.92" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#585254">Inputs required by Gold</text><text x="450" y="574.1" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#585254">Scripts not supplied</text><rect x="814" y="310" width="344" height="284" rx="14" fill="white" stroke="#73a89a" stroke-width="2"/><text x="836" y="345.04" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#73a89a">03</text><text x="836" y="390.26" font-family="DejaVu Serif" font-size="29" font-weight="400" fill="#4d3533">Gold</text><text x="836" y="427.86" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#4d3533">Analytics-ready views</text><text x="836" y="467.92" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#585254">dim_customers</text><text x="836" y="498.92" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#585254">dim_products</text><text x="836" y="529.92" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#585254">fact_sales</text><text x="836" y="574.1" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#73a89a">View definitions included</text><line x1="386" y1="450" x2="