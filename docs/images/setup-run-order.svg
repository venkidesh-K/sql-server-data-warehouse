<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="100%" height="100%" fill="white"/><text x="42" y="64.9" font-family="DejaVu Serif, Georgia, serif" font-size="35" font-weight="400" fill="#4d3533">Setup and run order</text><text x="44" y="106.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#585254">Prepare the missing dependencies before running the supplied SQL.</text><rect x="42" y="144" width="1116" height="88" rx="14" fill="#f6f2ef" stroke="#eae9ea" stroke-width="2"/><text x="64" y="179.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#73a89a">01</text><text x="121" y="177.62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#4d3533">Prepare the database</text><text x="121" y="208.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">Create schemas + Bronze/Silver tables</text><text x="784" y="191.04" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#585254">Setup DDL not supplied</text><rect x="42" y="248" width="1116" height="88" rx="14" fill="white" stroke="#73a89a" stroke-width="2"/><text x="64" y="283.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#73a89a">02</text><text x="121" y="281.62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#4d3533">Load Bronze</text><text x="121" y="312.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">Set six CSV paths; separate definition + EXEC</text><text x="784" y="295.04" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#73a89a">Procedure included</text><rect x="42" y="352" width="1116" height="88" rx="14" fill="#f6f2ef" stroke="#eae9ea" stroke-width="2"/><text x="64" y="387.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#73a89a">03</text><text x="121" y="385.62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#4d3533">Prepare Silver</text><text x="121" y="416.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">Clean keys and populate all six relations</text><text x="784" y="399.04" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#585254">Silver scripts not supplied</text><rect x="42" y="456" width="1116" height="88" rx="14" fill="white" stroke="#73a89a" stroke-width="2"/><text x="64" y="491.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#73a89a">04</text><text x="121" y="489.62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#4d3533">Create Gold</text><text x="121" y="520.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">Run ddl_gold.sql after Silver is ready</text><text x="784" y="503.04" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#73a89a">Three view definitions included</text><rect x="42" y="560" width="1116" height="88" rx="14" fill="white" stroke="#73a89a" stroke-width="2"/><text x="64" y="595.74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#73a89a">05</text><text x="121" y="593.62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#4d3533">Inspect the results</text><text x="121" y="624.92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#585254">Check counts, unique keys and unmatched sales</text><text x="784" y="607.04" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#73a89a">Starter checks in the run guide</text><line x1="42" y1="692" x2="1158" y2="692" stroke="#eae9ea" stroke-width="2"/><text x="44" y="728.86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#585254">Development use only: Bronze truncates tables; Gold drops and recreates views.</text></svg>
